version: 2
updates:
  - package-ecosystem: "npm"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
    open-pull-requests-limit: 10
    labels:
      - "dependencies"
    ignore:
      - dependency-name: "react"
        versions: [">=20"]
      - dependency-name: "react-dom"
        versions: [">=20"]

  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "monthly"
